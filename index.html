<style id="app-css">/* Layout: faixa azul de cabeçalho, abas roláveis fixas, conteúdo em grade de painéis (máx. 1200px), botão flutuante de cadastro rápido */
:root{
  --bg:#F5F7FA;--surface:#FFFFFF;--surface2:#EEF2F6;--fg:#101828;--muted:#667085;--line:#E4E7EC;
  --primary:#047857;--primary-ink:#FFFFFF;--primary-soft:#D1FAE5;
  --green:#067647;--green-soft:#DCFAE6;--lime:#12B981;--teal:#4F5BD5;--teal-soft:#E0E7FF;--khaki:#8FA99A;--khaki-soft:#EEF2EF;
  --danger:#D92D20;--danger-soft:#FEE4E2;--warn:#B54708;--warn-soft:#FEF0C7;
  --head:#101828;--head-ink:#F9FAFB;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 16px rgba(16,24,40,.06);
  --font:"Inter","Segoe UI",system-ui,sans-serif;--font-num:"Manrope","Inter",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220;--surface:#101828;--surface2:#1D2939;--fg:#F9FAFB;--muted:#98A2B3;--line:#344054;
  --primary:#12B981;--primary-ink:#0B1220;--primary-soft:#0F2E26;
  --green:#34D399;--green-soft:#0F2E26;--lime:#12B981;--teal:#818CF8;--teal-soft:#1E2347;--khaki:#8FA99A;--khaki-soft:#1C2723;
  --danger:#F97066;--danger-soft:#3B1715;--warn:#FBBF24;--warn-soft:#352A0C;
  --head:#0B1220;--head-ink:#F9FAFB;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220;--surface:#101828;--surface2:#1D2939;--fg:#F9FAFB;--muted:#98A2B3;--line:#344054;
  --primary:#12B981;--primary-ink:#0B1220;--primary-soft:#0F2E26;
  --green:#34D399;--green-soft:#0F2E26;--lime:#12B981;--teal:#818CF8;--teal-soft:#1E2347;--khaki:#8FA99A;--khaki-soft:#1C2723;
  --danger:#F97066;--danger-soft:#3B1715;--warn:#FBBF24;--warn-soft:#352A0C;
  --head:#0B1220;--head-ink:#F9FAFB;--shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--head);color:var(--head-ink)}
header.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:16px 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand svg{flex:none}
.brand h1{font-size:19px;margin:0;letter-spacing:.01em;font-weight:700}
.brand small{display:block;opacity:.8;font-size:12px}
.chip-mode{font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(18,185,129,.16);color:#34D399;border:1px solid rgba(52,211,153,.45);white-space:nowrap}
.regime{display:flex;border:1px solid rgba(255,255,255,.35);border-radius:999px;overflow:hidden}
.regime button{font:inherit;font-size:12px;font-weight:600;background:none;border:0;color:#fff;padding:5px 11px;cursor:pointer}
.regime button[aria-pressed="true"]{background:#12B981;color:#0B1220}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
nav.tabs button{font:inherit;background:none;border:0;color:var(--muted);padding:13px 12px 11px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap;font-weight:600}
nav.tabs button[aria-current="true"]{color:var(--primary);border-bottom-color:var(--green)}
nav.tabs .badge,.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{padding-block:20px 90px}
.status-note{margin-bottom:14px}
h2.sec{font-size:17px;margin:0;text-wrap:balance}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:4px 0 0}
.stack{display:flex;flex-direction:column;gap:16px}
.grid-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.hl{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.kpi.hl .l,.kpi.hl .s{color:inherit;opacity:.85}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--primary)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.panel h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.panel h3 .hint{text-transform:none;letter-spacing:0;font-weight:400;font-size:11px}
.cols2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.cols2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:980px){.cols3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){.cols2,.cols2e,.cols3{grid-template-columns:minmax(0,1fr)}}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.filters label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;min-width:0}
.filters select,.filters input{max-width:180px}
select,input,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
.filters select,.filters input{width:auto}
textarea{min-height:64px;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--primary);outline-offset:1px}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:8px 13px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.grn{background:var(--green);border-color:var(--green);color:#fff}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.actions{display:flex;gap:6px;flex-wrap:wrap}
td .actions{flex-wrap:nowrap}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface2);font-weight:600}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right}
td.wrapc{white-space:normal;min-width:170px}
tfoot td{font-weight:700;background:var(--surface2)}
tr.dim td{opacity:.6}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st-pago,.st-paga{background:var(--green-soft);color:var(--green)}
.st-agendado,.st-futura{background:var(--teal-soft);color:var(--teal)}
.st-pendente,.st-aberta{background:var(--surface2);color:var(--muted)}

header.top{border-bottom:1px solid rgba(255,255,255,.08)}
.brand h1{font-weight:700;letter-spacing:-.01em}
.kpi .v,.big,.num,td.num,th.num,.qval,.kv4 b,.ring span,.score b,.pnav b,.r,.imd b,.cdibar b,.mais b{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.kpi .v{font-weight:700;letter-spacing:-.01em}
.btn,.chip,select,input,textarea{border-radius:10px}.modal{border-radius:16px}.panel,.kpi{border-radius:var(--r)}
.kpi.hl{background:linear-gradient(135deg,#101828 0%,#1D2939 100%);border-color:#263449;color:#F9FAFB}
.kpi.hl .l,.kpi.hl .s{color:#98A2B3}
:root[data-theme="dark"] .kpi.hl,:root:not([data-theme="light"]) .kpi.hl{border-color:#263449}
.btn.grn{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.thm{font:inherit;background:none;border:1px solid rgba(255,255,255,.22);color:#F9FAFB;border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.thm svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:700px){.bnav{background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px)}.bnav .bplus{color:#0B1220;background:#12B981}}
.fab{background:#12B981;color:#0B1220}
</style>
<style id="ii-css">
.ii-drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;display:flex;flex-direction:column;gap:8px;background:var(--surface2)}
.ii-drop:hover{border-color:var(--primary)}
.ii-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.ii-grid:empty{display:none}
.ii-th{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2);display:flex;flex-direction:column;gap:4px;padding:0 0 6px}
.ii-th img,.ii-ph{width:100%;height:96px;object-fit:cover;display:block}
.ii-th .pill{align-self:flex-start;margin:0 6px;font-size:10px}
.ii-th small{padding:0 6px;font-size:11px;color:var(--muted);line-height:1.3}
.ii-x{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(11,18,32,.78);color:#F9FAFB;cursor:pointer}
.ii-x:disabled{opacity:.4;cursor:default}
.ii-list{display:flex;flex-direction:column;gap:10px;max-height:62vh;overflow-y:auto;padding-right:2px}
.ii-row{display:grid;grid-template-columns:auto 64px minmax(0,1fr);gap:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.ii-row.off{opacity:.6}
.ii-row>img{width:64px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.ii-f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.ii-tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ii-dup{background:var(--danger-soft);color:var(--danger)}
.ii-row .fw-ok,.ii-row .fw-warn{min-width:0}
@media (max-width:700px){.ii-row{grid-template-columns:auto minmax(0,1fr)}.ii-row>img{display:none}.ii-list{max-height:none}}
</style>
</head>

const HOL={};
function pascoa(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return y+'-'+pad(mo)+'-'+pad(da);}
function feriados(y){
 if(HOL[y])return HOL[y];const p=pascoa(y);const s={};
 ['01-01','04-21','05-01','09-07','10-12','11-02','11-15','11-20','12-25'].forEach(d=>s[y+'-'+d]='Feriado nacional');

/* saldoIni = saldo no início do dia saldoEm; movimentos a partir dessa data alteram o saldo */
function saldoConta(cid,ate){
 const c=conta(cid);if(!c)return 0;let s=+c.saldoIni||0;const base=c.saldoEm||'0000-00-00';
 const ok=d=>d>=base&&(!ate||d<=ate);
 D.lanc.forEach(l=>{
  if(realizado(l)&&!l.resgateDe&&ok(dataCaixa(l))){
   if(l.tipo==='R'&&l.conta===cid)s+=l.valor;

   else if(l.tipo==='T'){if(l.conta===cid)s-=l.valor;if(l.contaDest===cid)s+=l.valor;}}
  (l.rateio||[]).forEach(x=>{if(x.st==='recebido'&&x.conta===cid&&ok(x.recEm||x.data))s+=x.valor;});});

  if(t==='ap'&&a.de===cid)s-=v;else if(t==='res'&&a.para===cid)s+=v;});});return s;}

function mediaVariavel(n){const ks=monthRange(addYM(curYM(),-n),addYM(curYM(),-1));const L=D.lanc.filter(l=>l.tipo==='D'&&(l.nat||'variavel')==='variavel'&&!l.informada&&l.forma!=='vr'&&ks.includes(l.comp));const meses=new Set(L.map(l=>l.comp)).size;return meses?r2(sum(L,l=>l.valor)/n):0;}
function projecao(n){
 n=n||6;const cur=curYM();const mk=monthRange(cur,addYM(cur,n-1));const t=today();
 const med=mediaVariavel(3);let saldo=saldoTotal(t);const out=[];
 mk.forEach((k,i)=>{
  let ent=0,sai=0,fat=0,est=0,rateio=0;
  const mes=d=>{let m=ym(d);if(m<cur)m=cur;return m;};
  D.lanc.forEach(l=>{
   (l.rateio||[]).forEach(x=>{if(x.st!=='recebido'&&!isVR(x.conta)&&mes(x.data)===k)rateio+=x.valor;});
   if(l.tipo==='T'||isCred(l)||l.status==='pago')return;
   if(isVR(l.conta))return;

  D.cartoes.forEach(c=>faturas(c.id).forEach(f=>{if(f.saldo>0&&mes(f.venc)===k)fat+=f.saldo;}));
  D.rec.forEach(r=>{if(r.ativo===false||r.tipo==='T'||(r.skip||[]).includes(k))return;if(r.forma==='vr'||isVR(r.conta))return;

  const saidas=r2(sai+fat+est);ent=r2(ent+rateio);saldo=r2(saldo+ent-saidas);
  out.push({k,ent,rateio:r2(rateio),sai:r2(sai),fat:r2(fat),est:r2(est),saidas,saldo});
 });

}

const TRIB={auto:'Automática pelo tipo',isento:'Isento de IR',trib:'Tributado (IR regressivo)'};

function cdiVig(){const v=(D.cfg.cdi&&D.cfg.cdi.length?D.cfg.cdi:DEF_CFG.cdi).slice().sort((a,b)=>a.desde.localeCompare(b.desde));return v;}
function taxaCDI(d){const v=cdiVig();let t=v[0].taxa;v.forEach(x=>{if(x.desde<=d)t=x.taxa;});return +t;}
const fatDia=t=>Math.pow(1+t/100,1/252)-1;
const aliqIR=dias=>dias<=180?22.5:dias<=360?20:dias<=720?17.5:15;
let MC={};
/* Saldo de uma meta/investimento: lotes por aporte, rendimento diário composto em dias úteis
   (fator = ((1+CDI)^(1/252)-1) × % do CDI), resgates pelo mais antigo primeiro, IR regressivo e IOF por lote. */
function metaCalc(m,ate){
 ate=ate||today();const k=m.id+'|'+ate;if(MC[k])return MC[k];
 const auto=+m.pctCDI>0&&m.rendDesde&&m.rendDesde<=ate;const iniD=m.iniData||'2026-11-10';
 const mov=[{data:iniD,tipo:'ap',valor:+m.inicial||0}].concat((m.aportes||[]).map(a=>({data:a.data,tipo:a.tipo||'ap',valor:+a.valor||0}))).filter(x=>x.data<=ate&&x.valor>0).sort((a,b)=>a.data.localeCompare(b.data));
 let lots=[],rendAuto=0,rendMan=0;
 const tot=()=>lots.reduce((s,l)=>s+l.val,0);
 const apply=x=>{if(x.tipo==='ap')lots.push({data:x.data,pr:x.valor,val:x.valor});
  else if(x.tipo==='ren'){const t=tot();if(t>0)lots.forEach(l=>l.val+=x.valor*l.val/t);else lots.push({data:x.data,pr:0,val:x.valor});rendMan+=x.valor;}
  else{let r=x.valor;for(const l of lots){if(r<=0)break;const q=Math.min(l.val,r);const f=l.val?q/l.val:0;l.pr-=l.pr*f;l.val-=q;r-=q;}lots=lots.filter(l=>l.val>1e-7);}};
 let i=0;const cut=auto?m.rendDesde:'9999-12-31';
 while(i<mov.length&&mov[i].data<=cut){apply(mov[i]);i++;}
 if(auto){let d=addDays(m.rendDesde,1),n=0;const poup=m.tipo==='poup';
  while(d<=ate&&n<20000){n++;
   if(diaUtil(d)){const f=poup?fatDia(6.17):fatDia(taxaCDI(d))*(+m.pctCDI/100);lots.forEach(l=>{const g=l.val*f;l.val+=g;rendAuto+=g;});}
   while(i<mov.length&&mov[i].data===d){apply(mov[i]);i++;}
   d=addDays(d,1);}
  while(i<mov.length){apply(mov[i]);i++;}}
 let ir=0,iof=0;const isento=isentoIR(m);
 lots.forEach(l=>{const g=Math.max(0,l.val-l.pr);const dias=Math.round(dnum(ate)-dnum(l.data));const io=dias<30?g*IOF_T[Math.max(0,dias)]/100:0;iof+=io;if(!isento)ir+=(g-io)*aliqIR(dias)/100;});
 const bruto=tot(),investido=lots.reduce((s,l)=>s+l.pr,0);
 return MC[k]={bruto:r2(bruto),investido:r2(investido),rend:r2(bruto-investido),ir:r2(ir),iof:r2(iof),liquido:r2(bruto-ir-iof),rendAuto:r2(rendAuto),rendMan:r2(rendMan),auto:!!auto};
}
function rendPrev12(m){const s=metaCalc(m);if(!(+m.pctCDI>0)&&m.tipo!=='poup')return 0;const t=m.tipo==='poup'?6.17:taxaCDI(today())*(+m.pctCDI/100);const g=s.bruto*(Math.pow(1+t/100,1)-1);return r2(isentoIR(m)?g:g*(1-0.175));}

function rendaTipica(){
 const cur=curYM();const ks=monthRange(addYM(cur,-3),addYM(cur,-1));
 const reais=ks.map(k=>sum(D.lanc.filter(l=>l.tipo==='R'&&l.comp===k),l=>l.valor)).filter(v=>v>0);
 const mediaReal=reais.length?reais.reduce((a,b)=>a+b,0)/reais.length:0;
 const rec=sum(D.rec.filter(r=>r.tipo==='R'&&r.ativo!==false&&(r.freq||1)===1&&(!r.fim||r.fim>=cur)),r=>r.valor);
 return {valor:r2(Math.max(mediaReal,rec)),fonte:mediaReal>=rec&&mediaReal>0?'média real dos últimos meses':'receitas recorrentes (salário previsto + VR)'};
}
function mesesBase(){const cur=curYM();const ks=monthRange(addYM(cur,-3),addYM(cur,-1)).filter(k=>D.lanc.some(l=>l.tipo==='D'&&l.comp===k));return ks.length?ks.slice(-3):[cur];}
function essMensal(){
 const rs=D.cfg.reserva||DEF_CFG.reserva;if(+rs.base>0)return {valor:+rs.base,manual:true,meses:[]};
 const cur=curYM();const ess=new Set(rs.ess||[]);
 const ks=monthRange(addYM(cur,-3),addYM(cur,1)).filter(k=>D.lanc.some(l=>l.tipo==='D'&&ess.has(l.cat)&&l.comp===k)).slice(-3);
 const v=ks.length?ks.reduce((s,k)=>s+sum(D.lanc.filter(l=>l.tipo==='D'&&ess.has(l.cat)&&l.comp===k),minha),0)/ks.length:0;
 return {valor:r2(v),manual:false,meses:ks};
}
function reservaStats(){
 const rs=D.cfg.reserva||DEF_CFG.reserva;const e=essMensal();const ideal=r2(e.valor*(+rs.meses||6));
 const ms=D.metas.filter(m=>m.reserva);const acum=r2(sum(ms,m=>metaCalc(m).bruto));
 return {ess:e,meses:+rs.meses||6,ideal,acum,falta:r2(Math.max(0,ideal-acum)),cob:e.valor?acum/e.valor:0,pct:ideal?Math.min(100,acum/ideal*100):0,metas:ms};
}

 const parc=r2(ks.reduce((s,k)=>s+sum(D.lanc.filter(l=>l.tipo==='D'&&l.comp===k&&l.nat==='parcelada'),minha),0)/ks.length);
 const renda=R.valor||0;const comp=renda?desp/renda*100:0;const poup=renda?(renda-desp)/renda*100:0;const pp=renda?parc/renda*100:0;

 const pts={comp:comp<=70?25:comp<=80?20:comp<=90?12:comp<=100?6:0,poup:poup>=20?20:poup>=10?14:poup>=5?8:poup>=0?4:0,res:rs.cob>=rs.meses?25:rs.cob>=3?18:rs.cob>=1?10:rs.cob>0?4:0,parc:pp<=15?15:pp<=30?10:pp<=40?5:0,dia:venc===0?15:venc<=2?8:0};
 const nota=pts.comp+pts.poup+pts.res+pts.parc+pts.dia;let fx=FAIXAS[0];FAIXAS.forEach(f=>{if(nota>=f[0])fx=f;});
 return {renda,rendaFonte:R.fonte,desp,parc,comp,poup,pp,venc,rs,pts,nota,faixa:fx,meses:ks};

function niceMax(m){if(m<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(m)));const n=m/p;const s=n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;return s*p;}
function shortBRL(v){const a=Math.abs(v),s=v<0?'-':'';if(a>=1000)return s+'R$ '+nf(a/1000,a>=10000?0:1)+' mil';return s+'R$ '+nf(a,0);}
function donut(items,center,act){
 const tot=items.reduce((s,x)=>s+x.v,0);const R=80,r=52,C=90;let a=-Math.PI/2,g='';
 if(tot<=0)g='<circle cx="90" cy="90" r="66" fill="none" stroke="var(--surface2)" stroke-width="28"/>';
 items.forEach(x=>{if(x.v<=0)return;const f=x.v/tot;const a2=a+f*Math.PI*2-(f>=1?0.0001:0);const lg=f>.5?1:0;
  const p=(rr,an)=>(C+rr*Math.cos(an)).toFixed(2)+' '+(C+rr*Math.sin(an)).toFixed(2);
  g+='<path '+(act?'data-act="'+act+'" data-v="'+esc(x.id)+'" ':'')+'d="M'+p(R,a)+' A'+R+' '+R+' 0 '+lg+' 1 '+p(R,a2)+' L'+p(r,a2)+' A'+r+' '+r+' 0 '+lg+' 0 '+p(r,a)+' Z" fill="'+x.cor+'"><title>'+esc(x.nome+': '+brl(x.v)+' ('+nf(f*100)+'%)')+'</title></path>';a=a2;});
 g+='<text class="ctr" x="90" y="92" text-anchor="middle">'+esc(center||'')+'</text><text x="90" y="110" text-anchor="middle">total</text>';
 return '<svg class="chart" viewBox="0 0 180 180" role="img" aria-label="Distribuição">'+g+'</svg>';
}
function donutBlock(items,act,empty){

function groupBars(cols,opts){
 opts=opts||{};const W=680,H=240,L=62,R=8,T=14,B=30,iw=W-L-R,ih=H-T-B;
 let mx=0,mn=0;cols.forEach(c=>c.vals.forEach(x=>{mx=Math.max(mx,x.v);mn=Math.min(mn,x.v);}));
 const max=niceMax(mx);const n=cols.length||1;const per=cols[0]?cols[0].vals.length:1;const gw=iw/n*0.72;const bw=Math.min(22,gw/per);
 const Y=v=>T+ih-ih*v/max;let g='';
 for(let i=0;i<=4;i++){const v=max*i/4,y=Y(v);g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+shortBRL(v)+'</text>';}
 cols.forEach((c,i)=>{const cx=L+iw*(i+.5)/n;const x0=cx-bw*per/2;
  c.vals.forEach((x,j)=>{if(x.v<=0)return;const y=Y(x.v);g+='<rect '+(opts.act?'data-act="'+opts.act+'" data-v="'+c.key+'" ':'')+'x="'+(x0+j*bw+1)+'" y="'+y+'" width="'+(bw-2)+'" height="'+Math.max(T+ih-y,.5)+'" fill="'+x.cor+'" rx="2"><title>'+esc(c.label+' · '+x.nome+': '+brl(x.v))+'</title></rect>';});
  g+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle"'+(c.bold?' style="font-weight:700;fill:var(--fg)"':'')+'>'+esc(c.label)+'</text>';});
 if(opts.line){const pts=opts.line;const lmx=Math.max(max,...pts.map(p=>p.v));const lmn=Math.min(0,...pts.map(p=>p.v));const YL=v=>T+ih-ih*(v-lmn)/(niceMax(lmx)-lmn||1);
  const d=pts.map((p,i)=>(i?'L':'M')+(L+iw*(i+.5)/n).toFixed(1)+' '+YL(p.v).toFixed(1)).join(' ');
  g+='<path d="'+d+'" fill="none" stroke="var(--fg)" stroke-width="2" stroke-dasharray="5 4"/>';
  pts.forEach((p,i)=>{g+='<circle cx="'+(L+iw*(i+.5)/n)+'" cy="'+YL(p.v)+'" r="4" fill="'+(p.v<0?'var(--danger)':'var(--fg)')+'"><title>'+esc('Saldo projetado '+p.label+': '+brl(p.v))+'</title></circle><text x="'+(L+iw*(i+.5)/n)+'" y="'+(YL(p.v)-9)+'" text-anchor="middle" style="fill:var(--fg);font-weight:700">'+shortBRL(p.v)+'</text>';});}
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||'Gráfico de barras')+'">'+g+'</svg>';

 openModal({title:'Receber de '+x.pessoa,body:'<div class="info-box">'+esc(l.desc)+' · '+ymLong(l.comp)+(x.modo==='abat'?'<br>Abatimento: o valor é descontado do PIX do acerto, na conta escolhida.':'')+'</div><div class="frow">'+fld('Data',inp('data',x.modo==='abat'?x.data:today(),'type="date"'))+fld('Valor (R$)',money('valor',x.valor))+fld(x.modo==='abat'?'Conta do acerto':'Conta que recebeu',sel('conta',contasL(),x.conta))+'</div>',submit:'Confirmar recebimento',
  onSubmit:v=>{const val=r2(parseNum(v.valor));if(!(val>0))return 'Informe o valor.';if(Math.abs(val-x.valor)>0.004)return 'Para receber um valor diferente, ajuste a divisão no lançamento.';x.st='recebido';x.recEm=v.data||today();x.conta=v.conta;toast('Recebimento de '+x.pessoa+' registrado.');}});

function mDel(id){
 const l=byId(D.lanc,id);if(!l)return;
 const meta=D.metas.find(m=>(m.aportes||[]).some(a=>a.lancId===id));
 const fin=(ids)=>{const S=new Set(ids);D.lanc.filter(x=>S.has(x.id)&&x.recId).forEach(x=>{const r=byId(D.rec,x.recId);if(r){r.skip=r.skip||[];if(!r.skip.includes(x.comp))r.skip.push(x.comp);}});D.lanc=D.lanc.filter(x=>!S.has(x.id));D.metas.forEach(m=>m.aportes=(m.aportes||[]).filter(a=>!S.has(a.lancId)));D.revs.forEach(r=>{if(S.has(r.lancId))delete r.lancId;});toast(ids.length>1?ids.length+' lançamentos excluídos.':'Lançamento excluído.');};
 if(l.grupo){
  openModal({title:'Excluir parcela',danger:true,submit:'Excluir',body:'<p style="margin:0"><b>'+esc(l.desc)+'</b> · parcela '+l.parcN+'/'+l.parcT+' · '+brl(l.valor)+'</p><div class="mini-list">'+[['uma','Só esta parcela'],['seg','Esta e as seguintes'],['todas','Todas as '+l.parcT+' parcelas']].map((o,i)=>'<label class="check"><input type="radio" name="modo" value="'+o[0]+'"'+(i===0?' checked':'')+'> '+o[1]+'</label>').join('')+'</div>',
   onSubmit:v=>{const G=D.lanc.filter(x=>x.grupo===l.grupo);fin((v.modo==='todas'?G:v.modo==='seg'?G.filter(x=>x.parcN>=l.parcN):[l]).map(x=>x.id));}});return;}
 confirmBox('Excluir lançamento','Excluir <b>'+esc(l.desc)+'</b> ('+brl(l.valor)+', '+fd(l.data)+')?'+(l.recId?'<br><span class="small muted">A recorrência não vai recriar este lançamento em '+ymLabel(l.comp)+'.</span>':'')+(meta?'<br><span class="small muted">O movimento correspondente na reserva "'+esc(meta.nome)+'" também será removido.</span>':''),'Excluir',()=>fin([id]));
}
function mGrupo(g){
 const L=D.lanc.filter(l=>l.grupo===g).sort((a,b)=>a.parcN-b.parcN);const f=L[0];
 openModal({title:f.desc+' · '+f.parcT+'x',wide:true,body:'<div class="tbl-wrap"><table><thead><tr><th>Parcela</th><th>'+(isCred(f)?'Fatura':'Vencimento')+'</th><th>Comp.</th><th class="num">Valor</th><th>Status</th><th></th></tr></thead><tbody>'+L.map(l=>'<tr><td>'+l.parcN+'/'+l.parcT+'</td><td>'+(isCred(l)?ymLong(l.fat):fd(l.data))+'</td><td>'+ymLabel(l.comp)+'</td><td class="num">'+brl(l.valor)+'</td><td>'+stPill(stEf(l))+'</td><td>'+(!isCred(l)&&stEf(l)!=='pago'?'<button type="button" class="btn sm grn" data-act="pagar" data-id="'+l.id+'">Pagar</button>':'')+'</td></tr>').join('')+'</tbody><tfoot><tr><td colspan="3">Total</td><td class="num">'+brl(sum(L,l=>l.valor))+'</td><td colspan="2"></td></tr></tfoot></table></div>'});
}

function mFatPag(cid,ref){
 const c=cartao(cid);const f=fatura(cid,ref);
 openModal({title:'Pagar fatura · '+c.nome+' · '+ymLong(ref),body:'<dl class="kv"><dt>Total</dt><dd>'+brl(f.total)+'</dd><dt>Já pago</dt><dd>'+brl(f.pago)+'</dd><dt>Saldo</dt><dd><b>'+brl(f.saldo)+'</b></dd><dt>Vencimento</dt><dd>'+fd(f.venc)+(f.venc!==f.vencNom?' (dia útil)':'')+'</dd></dl><div class="frow">'+fld('Valor pago (R$)',money('valor',f.saldo))+fld('Data',inp('data',today(),'type="date"'))+fld('Conta de pagamento',sel('conta',contasL().filter(x=>!isVR(x[0])),c.contaPag))+'</div>'
  +(c.cashback>0?fld('Cashback deste pagamento (R$) · '+nf(c.cashback,1)+'%',money('cashback',r2(f.saldo*c.cashback/100)),'cb'):'')
  +(+c.pontosDolar?fld('Pontos acumulados nesta fatura',inp('pontos','','type="number" min="0" inputmode="numeric" placeholder="Informe pelo app do banco"')):'')
  +(c.cashbackPend?'<p class="small muted" style="margin:0">Cashback deste cartão: pendente de confirmação.</p>':'')
  +'<div class="info-box small">O pagamento baixa o saldo da conta e libera o limite. As compras já foram contadas como despesa; pagar a fatura não gera nova despesa. Cashback e pontos ficam como benefício, fora do saldo disponível.</div>',submit:'Registrar pagamento',
  onInput:(fm,e)=>{if(c.cashback>0&&e&&e.target===fm.elements.valor){const v=parseNum(fm.elements.valor.value);if(v>0)fm.elements.cashback.value=nf(r2(v*c.cashback/100),2);}},
  onSubmit:v=>{const val=r2(parseNum(v.valor));if(!(val>0))return 'Informe o valor.';if(val>f.saldo+0.005)return 'O valor é maior que o saldo da fatura ('+brl(f.saldo)+').';const p={id:uid(),cartao:cid,ref,valor:val,data:v.data||today(),conta:v.conta};const cb=r2(parseNum(v.cashback));if(cb>0)p.cashback=cb;const pt=parseInt(v.pontos);if(pt>0)p.pontos=pt;D.fpag.push(p);toast(val<f.saldo-0.005?'Pagamento parcial registrado.':'Fatura paga.');}});
}

/* ---- Categorias, orçamento ---- */
function mCat(id){
 const ed=id?byId(D.cats,id):null;const c=ed||{nome:'',tipo:'D',cor:'#12B981',subs:[],orc:0};
 openModal({title:ed?'Editar categoria':'Nova categoria',body:'<div class="frow">'+fld('Nome',inp('nome',c.nome))+fld('Tipo',sel('tipo',[['D','Despesa'],['R','Receita']],c.tipo,ed&&D.lanc.some(l=>l.cat===ed.id)?'disabled':''))+fld('Cor',inp('cor',c.cor,'type="color"'))+'</div>'+fld('Subcategorias (uma por linha)','<textarea name="subs" id="m-subs" style="min-height:110px">'+esc(c.subs.join('\n'))+'</textarea>')+fld('Orçamento mensal (R$, opcional)',money('orc',c.orc||''),'orc'),
  onInput:f=>{const t=f.elements.tipo;show(f,'orc',(t.disabled?c.tipo:t.value)==='D');},
  onSubmit:v=>{if(!v.nome.trim())return 'Informe o nome.';const subs=[...new Set(v.subs.split(/\n|,/).map(s=>s.trim()).filter(Boolean))];const orc=r2(parseNum(v.orc))||0;
   if(ed){const rem=ed.subs.filter(s=>!subs.includes(s));Object.assign(ed,{nome:v.nome.trim(),cor:v.cor,subs,orc,tipo:v.tipo||ed.tipo});if(rem.length)D.lanc.forEach(l=>{if(l.cat===ed.id&&rem.includes(l.sub))l.sub='';});}
   else D.cats.push({id:'cat'+uid(),ord:D.cats.length+1,nome:v.nome.trim(),tipo:v.tipo,cor:v.cor,subs,orc});toast('Categoria salva.');}});
}
function mCatDel(id){
 const c=byId(D.cats,id);if(id===MOTO){toast('A categoria Gastos com a Moto é usada pela aba Moto e não pode ser excluída.','err');return;}

async function lerPrint(file){
 const st=document.getElementById('m-pst');if(st)st.textContent='Lendo o print… isso leva alguns segundos.';
 const cats=D.cats.map(c=>c.id+': '+c.nome+' ['+c.subs.join(', ')+'] ('+(c.tipo==='R'?'receita':'despesa')+')').join('\n');
 const contas=D.contas.map(c=>c.nome+(c.tipo==='beneficio'?' (vale-refeição)':'')).join(', ');const cards=D.cartoes.map(c=>c.nome+(c.final?' final '+c.final:'')).join(', ');
 const prompt='Você lê prints (capturas de tela) de comprovantes, notificações de compra, faturas ou extratos de bancos brasileiros e extrai UMA transação. Hoje é '+today()+'.\nResponda somente com um objeto JSON neste formato:\n{"tipo":"D" ou "R","valor":number,"data":"AAAA-MM-DD","descricao":string curta (estabelecimento ou motivo),"forma":"pix"|"deb"|"cred"|"din"|"bol"|"transf"|"vr","instituicao":string ou null,"final_cartao":string ou null,"parcelas":inteiro (1 se à vista),"categoria":id da lista,"subcategoria":string da lista ou null,"confianca":{"valor":0-1,"data":0-1,"descricao":0-1,"forma":0-1,"conta":0-1,"categoria":0-1}}\nRegras: valor sempre positivo (em reais, total da compra); se o ano não aparecer, use o ano atual, ou o anterior se a data ficar no futuro; "R" só para dinheiro recebido; se houver várias transações, use a mais destacada.\nCategorias (id: nome [subcategorias]):\n'+cats+'\nContas do usuário: '+contas+'\nCartões do usuário: '+cards;
 let r;try{r=await SAMPLE.json(prompt,{images:[file],modelTier:'default'});}catch(e){if(st)st.textContent=e&&e.code==='not_granted'?'Permissão para usar o Claude não concedida.':e&&e.code==='image_rejected'?'Imagem não aceita. Tente outro arquivo (PNG ou JPG).':'Não consegui ler o print ('+((e&&e.code)||'erro')+'). Tente de novo.';return;}
 if(!r||typeof r!=='object'){if(st)st.textContent='Não encontrei uma transação no print.';return;}
 mPrintRev(file,r);

function mPrintRev(file,r){

 const tipo=r.tipo==='R'?'R':'D';let catId=D.cats.some(c=>c.id===r.categoria)?r.categoria:'';let sub=r.subcategoria||'';let catFromHist=false;

 if(!catId)catId=(topCats(tipo)[0]||{}).id||'';

 if(r.forma==='cred'){const c=D.cartoes.find(c=>(fin&&c.final&&c.final===fin))||D.cartoes.find(c=>inst&&(c.nome.toLowerCase().includes(inst)||inst.includes(c.inst.toLowerCase())));if(c)pay='k:'+c.id;}

  +'<div'+W('categoria',!catFromHist&&low('categoria'))+'>'+'<div class="frow">'+fld('Categoria'+(catFromHist?' · pelo seu histórico':''),sel('cat',D.cats.map(c=>[c.id,c.nome]),catId))+fld('Subcategoria',sel('sub',subsL(catId),sub))+'</div></div>'
  +fld('Parcelas',inp('parc',parc,'type="number" min="1" max="72"'))
  +(dp?'<div class="info-box small" style="background:var(--warn-soft);color:var(--warn)">Já existe "'+esc(dp.desc)+'" de '+brl(dp.valor)+' em '+fd(dp.data)+'. Confirme só se for outro lançamento.</div>':'')
  +'<div class="info-box small" id="m-pinfo" hidden></div></div>';
 openModal({title:'Conferir leitura do print',wide:true,body,submit:'Confirmar',extra:'<button type="button" class="btn" data-close="1" style="margin-right:auto">Descartar</button><button type="button" class="btn" data-act="pfull">Abrir no formulário completo</button>',
  onInput:(f,e)=>{const g=n=>f.elements[n];if(e&&e.target===g('cat'))fillSelect(g('sub'),subsL(g('cat').value),'');const pk=g('pay').value;const i=f.querySelector('#m-pinfo');const tx=pk.startsWith('k:')?'Entra na fatura de '+ymLong(addYM(refFatura(pk.slice(2),g('data').value||today()),0))+'.':'';i.textContent=tx;i.hidden=!tx;
   if(e&&e.target&&e.target.closest('.fw-warn'))e.target.closest('.fw-warn').className='fw-ok';},
  onSubmit:v=>{const vv=r2(parseNum(v.valor));if(!(vv>0))return 'Informe o valor.';const np=Math.max(1,parseInt(v.parc)||1);

/* ===================== Persistência (banco do artefato, com cópia local de reserva) ===================== */
let MODE='loading',db=null,loaded=false,statusMsg='';
const LAST={};const wq=new Map();let working=false;
const ORD=['cats','contas','cartoes'];
function docsOf(col){return col==='cfg'?[Object.assign({},D.cfg,{id:'geral'})]:D[col];}
function persist(){
 if(MODE==='local'){try{localStorage.setItem(LS_KEY,JSON.stringify(D));localStorage.setItem(LS_KEY+'-ts',String(Date.now()));}catch(e){toast('O navegador bloqueou o armazenamento local. Exporte um backup.','err');}return;}
 if(MODE!=='cloud'||!loaded)return;
 ['cfg'].concat(COLS).forEach(col=>{const prev=LAST[col]||{};const now={};docsOf(col).forEach(o=>{const j=JSON.stringify(o);now[o.id]=j;if(prev[o.id]!==j)queueWrite(col,o.id,JSON.parse(j));});Object.keys(prev).forEach(id=>{if(!(id in now))queueWrite(col,id,null);});LAST[col]=now;});
}
function commit(){gerarObrigacoes();persist();schedule();}
function queueWrite(col,id,obj){const k=col+'|'+id;wq.delete(k);wq.set(k,{col,id,obj});pump();}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function pump(){
 if(working)return;working=true;
 while(wq.size){const [k,v]=wq.entries().next().value;wq.delete(k);savingUI();
  const ref=db.collection(v.col).doc(v.id);const run=()=>v.obj?ref.set(v.obj):ref.delete();
  try{await run();}catch(e){if(e&&e.code==='unavailable'){await sleep(700+Math.random()*900);try{await run();}catch(e2){writeFail(e2);}}else writeFail(e);}}
 working=false;savingUI();
}
function writeFail(e){const c=e&&e.code;
 if(c==='invalid_argument')toast('Sem permissão para salvar ou dado inválido: '+((e&&e.message)||''),'err');
 else if(c==='quota_exceeded')toast('Limite de armazenamento atingido. Exporte um backup e exclua lançamentos antigos.','err');
 else if(c==='resource_exhausted')toast('Muitas gravações seguidas. Aguarde alguns segundos.','err');
 else toast('Não foi possível salvar: '+((e&&e.message)||'erro desconhecido'),'err');}
function savingUI(){const el=document.getElementById('saving');if(!el)return;const n=wq.size+(working?1:0);el.textContent=MODE==='cloud'?(n?'Salvando… ('+n+')':'Tudo salvo'):'';}
function startCloud(){
 const all=['cfg'].concat(COLS);const pend=new Set(all);
 const timer=setTimeout(()=>{if(pend.size){statusMsg='Os dados ainda não carregaram. Verifique a conexão; a página atualiza sozinha quando o banco responder.';schedule();}},10000);
 all.forEach(col=>{
  db.collection(col).onSnapshot(snap=>{
   const m={};snap.docs.forEach(d=>{m[d.id]=Object.assign(clone(d.data()),{id:d.id});});
   const base={};Object.keys(m).forEach(id=>base[id]=JSON.stringify(m[id]));
   wq.forEach(v=>{if(v.col===col){if(v.obj)m[v.id]=v.obj;else delete m[v.id];}});
   if(col==='cfg'){const g=m.geral;D.cfg=Object.assign(clone(DEF_CFG),g||{});D.cfg.moto=Object.assign(clone(DEF_CFG.moto),(g&&g.moto)||{});delete D.cfg.id;LAST.cfg={geral:JSON.stringify(Object.assign({},D.cfg,{id:'geral'}))};if(g)LAST.cfg.geral=JSON.stringify(Object.assign({},D.cfg,{id:'geral'}));}
   else{let arr=Object.values(m);if(ORD.includes(col))arr.sort((a,b)=>(a.ord||99)-(b.ord||99)||String(a.nome).localeCompare(String(b.nome)));D[col]=arr;LAST[col]={};arr.forEach(o=>LAST[col][o.id]=base[o.id]||JSON.stringify(o));}
   invalidate();
   if(!snap.metadata.fromCache&&pend.has(col)){pend.delete(col);if(!pend.size){clearTimeout(timer);statusMsg='';loaded=true;migrarMetas();migrarCores();gerarObrigacoes();persist();}}
   schedule();
  },err=>{pend.delete(col);statusMsg='Falha ao sincronizar ('+col+'): '+((err&&err.message)||(err&&err.code))+'. Recarregue a página.';if(!pend.size){clearTimeout(timer);loaded=true;}schedule();});
 });
}

/* ---- imagens: reduz para 1600px (JPEG) antes de enviar ---- */
function iiPrep(file){return new Promise((res,rej)=>{
  if(!/^image\//.test(file.type||'')&&!/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name||''))return rej(new Error('Formato não suportado.'));
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{try{const s=Math.min(1,1600/Math.max(im.naturalWidth||im.width,im.naturalHeight||im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round((im.naturalWidth||im.width)*s));c.height=Math.max(1,Math.round((im.naturalHeight||im.height)*s));c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    c.toBlob(b=>b?res({url:u,blob:b}):res({url:u,blob:file}),'image/jpeg',.85);}catch(e){res({url:u,blob:file});}};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Imagem ilegível ou formato não suportado.'));};im.src=u;});}
async function iiAdd(files){for(const f of files){if(II.items.length>=II_MAX){toast('Máximo de '+II_MAX+' imagens por leitura.','err');break;}
  const it={id:uid(),name:f.name||'foto',st:'wait',msg:''};II.items.push(it);iiGrid();
  try{const p=await iiPrep(f);it.url=p.url;it.blob=p.blob;}catch(e){it.st='err';it.msg=e.message;}iiGrid();}}
function iiGrid(){const g=document.getElementById('ii-grid');if(!g)return;
  g.innerHTML=II.items.map(it=>'<div class="ii-th">'+(it.url?'<img src="'+it.url+'" alt="">':'<div class="ii-ph"></div>')+'<button type="button" class="ii-x" data-act="iirm" data-id="'+it.id+'" aria-label="Remover imagem"'+(II.busy?' disabled':'')+'>✕</button><span class="pill '+IIPC[it.st]+'">'+IIST[it.st]+(it.st==='ok'?' · '+it.n:'')+'</span>'+(it.msg?'<small>'+esc(it.msg)+'</small>':'')+'</div>').join('');
  const fim=II.items.filter(i=>['ok','err','unread'].includes(i.st)).length,b=document.getElementById('ii-bar'),p=document.getElementById('ii-prog');

  const sb=document.querySelector('.modal button[type=submit]');if(sb&&document.getElementById('ii-grid')){sb.disabled=II.busy;sb.textContent=II.busy?'Lendo…':'Ler imagens';}}

/* ---- backend ---- */
async function iiRead(it){const c=iiCfg();let last;
  for(let a=0;a<3;a++){const ac=new AbortController(),to=setTimeout(()=>ac.abort(),70000);
    if(II.ctrl)II.ctrl.signal.addEventListener('abort',()=>ac.abort(),{once:true});
    try{const img=await iiB64(it.blob);
      const r=await fetch(c.url+'/extract',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json','X-App-Token':c.token},body:JSON.stringify({image:img,mediaType:(it.blob.type||'image/jpeg'),hoje:today(),ctx:iiCtx()})});
      clearTimeout(to);
      if(r.status===401||r.status===403){it.st='err';it.msg='Servidor recusou o acesso (token ou origem).';return;}
      if(r.status===413){it.st='err';it.msg='Imagem grande demais.';return;}
      if(!r.ok)throw new Error('HTTP '+r.status);
      const j=await r.json();if(!j||j.ok===false)throw new Error((j&&j.erro)||'resposta inválida');
      const tx=Array.isArray(j.transacoes)?j.transacoes:[];
      if(j.legivel===false||!tx.length){it.st='unread';it.msg=j.observacao||'Nenhuma transação legível.';it.rows=[];return;}
      it.rows=tx;it.n=tx.length;it.st='ok';it.msg='';II.dirty=true;return;}
    catch(e){clearTimeout(to);last=e;if(II.ctrl&&II.ctrl.signal.aborted)return;await sleep(500*(a+1));}}
  it.st='err';it.msg=!navigator.onLine?'Sem conexão. Tente de novo quando a internet voltar.':'Servidor indisponível ('+((last&&last.message)||'erro')+').';}
async function iiRun(list){II.busy=true;II.ctrl=new AbortController();iiGrid();const q=list.slice();
  const w=async()=>{while(q.length&&!II.ctrl.signal.aborted){const it=q.shift();it.st='busy';it.msg='';iiGrid();await iiRead(it);iiGrid();}};
  await Promise.all([w(),w()]);const ab=II.ctrl.signal.aborted;II.busy=false;iiGrid();if(ab)return;
  if(II.items.some(i=>i.st==='ok'))iiReview();else toast('Nenhuma transação foi identificada. Veja o aviso em cada imagem.','err');}

/* ---- interpretação: casa a leitura com contas, cartões e categorias já cadastrados ---- */
function iiPay(t,forma){const n=s=>nrm(s||''),cc=t.conta_cartao||{},fin=String(cc.final||'').replace(/\D/g,'').slice(-4),bn=n(t.banco_origem),nm=n(cc.nome);
  const hit=o=>[o.nome,o.inst].filter(Boolean).map(n).filter(x=>x.length>=3).some(k=>(bn&&(bn.includes(k)||k.includes(bn)))||(nm&&(nm.includes(k)||k.includes(nm))));
  if(forma==='cred'||cc.tipo==='cartao'){const c=(fin&&D.cartoes.find(c=>String(c.final||'')===fin))||D.cartoes.find(hit);if(c)return {k:'k:'+c.id,ok:true};}
  if(forma==='vr'){const v=D.contas.find(c=>c.tipo==='beneficio');if(v)return {k:'c:'+v.id,ok:true};}
  if(forma!=='cred'){const a=D.contas.find(c=>c.tipo!=='beneficio'&&hit(c));if(a)return {k:'c:'+a.id,ok:true};}
  return {k:II.pay,ok:false};}
function iiRow(t,it){
  const cf=t.confianca||{},cv=k=>Math.max(0,Math.min(1,+cf[k]||0)),low=new Set();
  const tipo=['D','R','T'].includes(t.natureza)?t.natureza:'',forma=['pix','deb','cred','transf','bol','din','vr'].includes(t.forma)?t.forma:'';
  const nome=String(t.estabelecimento||'').trim().slice(0,80),desc=(String(t.descricao||'').trim()||nome).slice(0,80);
  const parc=Math.max(1,Math.min(72,parseInt(t.parcelas)||1)),pa=Math.max(1,Math.min(parc,parseInt(t.parcela_atual)||1));
  let vt=+t.valor_total>0?r2(+t.valor_total):null;const vp=+t.valor_parcela>0?r2(+t.valor_parcela):null;let calc=false;
  if(vt==null&&vp!=null){vt=parc>1?r2(vp*parc):vp;calc=parc>1;}
  let data=iiOkDate(t.data)?t.data:'',inf=false;const dm=String(t.dia_mes||'').match(/^(\d{1,2})\/(\d{1,2})$/);
  if(!data&&dm){const d=+dm[1],m=+dm[2];if(d>=1&&d<=31&&m>=1&&m<=12){const y=+today().slice(0,4),mk=Y=>Y+'-'+pad(m)+'-'+pad(Math.min(d,lastDay(Y,m)));data=mk(y)>addDays(today(),2)?mk(y-1):mk(y);inf=true;}}
  const pg=iiPay(t,forma),tp=tipo==='R'?'R':'D';let c=null;
  if(tipo!=='T'&&(nome||desc))c=impSugCat(nome||desc,tp);
  let cid=c?c.cat:'',sub=c?c.sub:'',src=c?c.src:'';
  if(!cid&&tipo!=='T'&&D.cats.some(k=>k.id===t.categoria_sugerida&&k.tipo===tp)){cid=t.categoria_sugerida;sub=cat(cid).subs.includes(t.subcategoria_sugerida)?t.subcategoria_sugerida:'';src='IA';}
  let dest='';if(tipo==='T'){const cd=t.conta_destino||{},n=nrm(cd.nome||'')+' '+nrm(cd.banco||'');const a=D.contas.find(a=>a.id!==pg.k.slice(2)&&a.tipo!=='beneficio'&&[a.nome,a.inst].filter(Boolean).some(s=>nrm(s).length>=3&&n.includes(nrm(s))));dest=a?a.id:'';}
  if(vt==null||cv('valor')<II_MIN)low.add('valor');
  if(!data||inf||cv('data')<II_MIN)low.add('data');
  if(!tipo||cv('tipo')<II_MIN)low.add('tipo');
  if(!pg.ok)low.add('conta');
  const crit=low.size>0;if(tipo!=='T'&&!cid)low.add('categoria');
  const hora=/^\d{2}:\d{2}$/.test(t.horario||'')?t.horario:'',banco=String(t.banco_origem||'').slice(0,40);
  return {it,tipo,forma,op:t.tipo_operacao,nome,desc,vt,parc,pa,data,hora,banco,pay:pg.k,dest,cat:cid,sub,src,low,inf,calc,crit,ocr:String(t.trecho_ocr||'').slice(0,400),dup:null,on:false};}

const iiSim=(a,b)=>{a=nrm(a);b=nrm(b);if(!a||!b)return false;if(a===b||a.includes(b)||b.includes(a))return true;const s=new Set(a.split(' ').filter(w=>w.length>2));return b.split(' ').some(w=>w.length>2&&s.has(w));};
const iiKey=x=>'img|'+[x.tipo,x.vt,x.data,x.hora,nrm(x.nome||x.desc)].join('|');
function iiDup(x){if(!x.vt||!x.data)return null;const nm=x.nome||x.desc;let best=null;
  const e=D.lanc.find(l=>l.imp===iiKey(x));if(e)return {l:e,lvl:'prov'};
  D.lanc.forEach(l=>{const pc=x.parc>1||l.parcT>1;if(!(pc?Math.abs((l.total||l.valor)-x.vt)<.006:Math.abs(l.valor-x.vt)<.006))return;
    if(Math.abs(dnum(l.data)-dnum(x.data))>(pc?45:1))return;
    const lvl=((l.tipo===x.tipo?1:0)+(iiSim(l.desc,nm)?1:0))===2?'prov':'poss';if(!best||(lvl==='prov'&&best.lvl!=='prov'))best={l,lvl};});
  return best;}
const iiBatch=(x,j)=>{for(let k=0;k<j;k++){const y=II.rows[k];if(y.vt&&y.vt===x.vt&&y.data===x.data&&y.tipo===x.tipo&&iiSim(y.nome||y.desc,x.nome||x.desc)&&(!y.hora||!x.hora||y.hora===x.hora))return {l:{desc:'linha '+(k+1)+' desta leitura',valor:y.vt,data:y.data},lvl:'prov'};}return null;};

/* ---- geração dos lançamentos (mesmas regras de mLanc: parcelas, fatura, status, transferência) ---- */
function iiGerar(R){const out=[];
  R.forEach(x=>{const p=payOpts().find(p=>p.k===x.pay),cred=p.forma==='cred';
    const base={tipo:x.tipo,desc:x.desc||x.nome||(x.tipo==='T'?'Transferência':cat(x.cat).nome),valor:x.vt,data:x.data,comp:ym(x.data),nat:x.tipo==='D'?'variavel':(x.tipo==='R'?'variavel':''),imp:iiKey(x),
      obs:'Importado por imagem'+(x.hora?' · '+x.hora:'')+(x.banco?' · '+x.banco:'')};
    const st=l=>{if(l.data<=today()){l.status='pago';l.pagEm=l.data;}else l.status='agendado';};
    if(x.tipo==='T'){const l=Object.assign(base,{id:uid(),forma:'transf',conta:p.conta,contaDest:x.dest,cartao:'',cat:'',sub:''});st(l);out.push(l);return;}
    const fm=cred?'cred':p.forma==='vr'?'vr':(['pix','deb','transf','bol','din'].includes(x.forma)&&(x.tipo==='D'||['pix','transf','din'].includes(x.forma))?x.forma:'pix');
    Object.assign(base,{cat:x.cat,sub:x.sub||'',forma:fm,conta:cred?'':p.conta,cartao:cred?p.cartao:'',contaDest:''});
    const np=x.tipo==='D'?x.parc:1;
    if(np>1){const g=uid(),pa=x.pa||1,b=Math.floor(x.vt/np*100)/100;
      for(let i=0;i<np-pa+1;i++){const k=pa+i,l=Object.assign({},base,{id:uid()+i,valor:k===np?r2(x.vt-b*(np-1)):r2(b),nat:'parcelada',grupo:g,parcN:k,parcT:np,total:x.vt,comp:addYM(base.comp,i)});
        if(cred){l.status='pendente';l.fat=addYM(refFatura(l.cartao,x.data),i);}else{l.data=addMonths(x.data,i);if(i===0)st(l);else l.status='pendente';}
        out.push(l);}return;}
    const l=Object.assign(base,{id:uid()});if(cred){l.status='pendente';l.fat=refFatura(l.cartao,l.data);}else st(l);out.push(l);});
  return out;}

    if(u&&!/^https:\/\//.test(u)&&!/^http:\/\/(localhost|127\.0\.0\.1)/.test(u))return 'A URL do backend deve começar com https://';
    try{localStorage.setItem(II_KEY,JSON.stringify({url:u,token:(v.token||'').trim()}));}catch(e){}
    II.pay=v.pay;const todo=II.items.filter(i=>i.blob&&!['ok','unread'].includes(i.st));
    if(!II.items.length)return 'Adicione ao menos uma imagem.';
    if(!todo.length){if(II.items.some(i=>i.st==='ok')){iiReview();return false;}return 'Não há imagens para ler.';}
    if(!u)return 'Informe a URL do servidor de leitura (veja o README).';
    iiRun(todo);return false;}});
  II.keep=false;iiGrid();}

function iiDupH(x){return x.dup?'<div class="info-box small ii-dup">'+(x.dup.lvl==='prov'?'Provável duplicado':'Possível duplicado')+': <b>'+esc(x.dup.l.desc)+'</b> · '+brl(x.dup.l.valor)+' · '+fd(x.dup.l.data)+'</div>':'';}
function iiInfoH(x){const p=payOpts().find(p=>p.k===x.pay),t=[];if(p&&p.forma==='cred'&&x.data&&x.tipo==='D'){t.push('Entra na fatura de '+ymLong(refFatura(p.cartao,x.data))+'.');}
  if(x.parc>1&&x.vt)t.push((x.parc-x.pa+1)+' parcela(s) a lançar, de '+brl(Math.floor(x.vt/x.parc*100)/100)+' (total '+brl(x.vt)+').');return t.join(' ');}
function iiRowH(x,j){const W=k=>x.low.has(k)?'fw-warn':'fw-ok',pay=payOpts().find(p=>p.k===x.pay)||{},T=x.tipo==='T',tp=x.tipo==='R'?'R':'D';
  const tags=(x.op?'<span class="pill st-agendado">'+(IIOP[x.op]||esc(x.op))+'</span>':'')+(x.parc>1?'<span class="pill st-fechada">'+x.parc+'x'+(x.pa>1?' · parcela '+x.pa:'')+'</span>':'')+(x.inf?'<span class="pill st-fechada">ano assumido</span>':'')+(x.calc?'<span class="pill st-pendente">total calculado</span>':'')+'<span class="small muted">'+[x.hora,x.banco].filter(Boolean).map(esc).join(' · ')+'</span>';
  return '<div class="ii-row'+(x.on?'':' off')+'" data-j="'+j+'"><label class="imck"><input type="checkbox" name="on_'+j+'"'+(x.on?' checked':'')+' aria-label="Lançar"></label>'+(x.it.url?'<img src="'+x.it.url+'" alt="Imagem de origem">':'<span></span>')
   +'<div class="stack" style="gap:8px"><div class="ii-tags">'+tags+'</div><div id="ii-dup_'+j+'">'+iiDupH(x)+'</div><div class="ii-f">'
   +'<div class="'+W('valor')+'">'+fld(x.parc>1?'Valor total (R$)':'Valor (R$)',money('valor_'+j,x.vt))+'</div>'
   +'<div class="'+W('data')+'">'+fld('Data'+(x.inf?' · confirme o ano':''),inp('data_'+j,x.data,'type="date"'))+'</div>'
   +'<div class="'+W('tipo')+'">'+fld('Tipo',sel('tipo_'+j,(x.tipo?[]:[['','Escolher…']]).concat([['D','Despesa'],['R','Receita'],['T','Transferência']]),x.tipo))+'</div>'
   +'<div class="'+W('conta')+'">'+fld(T?'Sai da conta':'Pago com',sel('pay_'+j,payOpts().map(p=>[p.k,p.l]),x.pay))+'</div>'
   +(T?fld('Conta de destino',sel('dest_'+j,[['','Escolher…']].concat(contasL().filter(c=>c[0]!==pay.conta)),x.dest))
      :'<div class="'+W('categoria')+'">'+fld('Categoria'+(x.src?' · '+esc(x.src):''),sel('cat_'+j,[['','Escolher…']].concat(catsL(tp)),x.cat))+'</div>'+fld('Subcategoria',sel('sub_'+j,subsL(x.cat),x.sub)))
   +fld('Descrição',inp('desc_'+j,x.desc))
   +(x.tipo==='D'?fld('Parcelas',inp('parc_'+j,x.parc,'type="number" min="1" max="72"')):'')+(x.tipo==='D'&&x.parc>1?fld('Parcela atual',inp('pa_'+j,x.pa,'type="number" min="1" max="'+x.parc+'"')):'')
   +'</div><div class="small muted">'+iiInfoH(x)+'</div>'+(x.ocr?'<details class="small"><summary>Texto lido na imagem</summary><span class="muted">'+esc(x.ocr)+'</span></details>':'')+'</div></div>';}
function iiSync(f){II.rows.forEach((x,j)=>{const g=n=>f.elements[n+'_'+j];if(!g('on'))return;x.on=g('on').checked;const v=parseNum(g('valor').value);x.vt=v>0?r2(v):null;x.data=g('data').value;x.desc=g('desc').value.trim();x.tipo=g('tipo').value;x.pay=g('pay').value;
  if(g('dest'))x.dest=g('dest').value;if(g('cat')){if(g('cat').value!==x.cat){x.cat=g('cat').value;x.sub='';}else x.sub=g('sub').value;}
  x.parc=g('parc')?Math.max(1,Math.min(72,parseInt(g('parc').value)||1)):1;x.pa=g('pa')?Math.max(1,Math.min(x.parc,parseInt(g('pa').value)||1)):1;});}
function iiSum(){const el=document.getElementById('ii-sum');if(!el)return;const on=II.rows.filter(x=>x.on);
  el.innerHTML='<b>'+on.length+'</b> de '+II.rows.length+' selecionadas · despesas '+brl(sum(on.filter(x=>x.tipo==='D'&&x.vt),x=>x.vt))+' · receitas '+brl(sum(on.filter(x=>x.tipo==='R'&&x.vt),x=>x.vt))+' · '+II.rows.filter(x=>x.dup).length+' possíveis duplicadas · '+II.rows.filter(x=>x.crit).length+' com leitura incerta (desmarcadas até você conferir).';}
function iiReview(){
  if(II.dirty||!II.rows.length){II.rows=[];II.items.filter(i=>i.st==='ok').forEach(it=>(it.rows||[]).forEach(t=>II.rows.push(iiRow(t,it))));
    II.rows.forEach((x,j)=>{x.dup=iiDup(x)||iiBatch(x,j);x.on=!x.crit&&!x.dup&&(x.tipo==='T'?!!x.dest:!!x.cat);});II.dirty=false;II.dupOk=false;}
  if(!II.rows.length){toast('Nada para revisar.','err');return;}
  const body='<div class="info-box small" id="ii-sum"></div><div class="chips"><button type="button" class="chip" data-act="iiall" data-v="1">Marcar todas</button><button type="button" class="chip" data-act="iiall" data-v="0">Desmarcar todas</button></div><div class="ii-list" id="ii-list">'+II.rows.map(iiRowH).join('')+'</div>';
  openModal({title:'Revisar leitura',wide:true,body,submit:'Lançar selecionadas',
   onClose:()=>{if(II.keep)return;II.items.forEach(i=>i.url&&URL.revokeObjectURL(i.url));II={items:[],rows:[],busy:false,ctrl:null,keep:false,dirty:false,pay:'',dupOk:false};},
   extra:'<button type="button" class="btn" data-act="iiback" style="margin-right:auto">Voltar às imagens</button>',
   onInput:(f,e)=>{const n=e&&e.target&&e.target.name,m=n&&n.match(/^([a-z]+)_(\d+)$/);if(!m){iiSum();return;}
    const k=m[1],j=+m[2],x=II.rows[j];iiSync(f);
    const lk={valor:'valor',data:'data',tipo:'tipo',pay:'conta',cat:'categoria'}[k];
    if(lk){x.low.delete(lk);const w=e.target.closest('.fw-warn');if(w)w.className='fw-ok';}
    if(k==='on'){const r=f.querySelector('.ii-row[data-j="'+j+'"]');if(r)r.classList.toggle('off',!x.on);}
    if(e.type==='change'&&['tipo','pay','cat','parc'].includes(k)){
     if(k==='tipo'){const s=x.tipo==='T'?null:impSugCat(x.nome||x.desc,x.tipo==='R'?'R':'D');x.cat=s?s.cat:'';x.sub=s?s.sub:'';x.src=s?s.src:'';}
     x.dup=iiDup(x)||iiBatch(x,j);const r=f.querySelector('.ii-row[data-j="'+j+'"]'),t=document.createElement('div');t.innerHTML=iiRowH(x,j);r.replaceWith(t.firstChild);}
    else if(e.type==='change'&&['valor','data','desc'].includes(k)){x.dup=iiDup(x)||iiBatch(x,j);const b=f.querySelector('#ii-dup_'+j);if(b)b.innerHTML=iiDupH(x);}
    iiSum();},
   onSubmit:(v,f)=>{iiSync(f);const S=II.rows.map((x,j)=>[x,j]).filter(([x])=>x.on);if(!S.length)return 'Nenhuma transação marcada.';
    for(const [x,j] of S){const n='Linha '+(j+1)+': ',p=payOpts().find(p=>p.k===x.pay);
     if(!x.vt)return n+'informe o valor.';if(!iiOkDate(x.data))return n+'informe uma data válida.';if(!x.tipo)return n+'escolha o tipo.';if(!p)return n+'escolha a conta ou o cartão.';
     if(x.tipo==='T'){if(p.forma==='cred')return n+'transferência precisa sair de uma conta.';if(!x.dest||x.dest===p.conta)return n+'escolha a conta de destino.';}
     else if(!x.cat)return n+'escolha a categoria.';
     if(x.tipo==='R'&&p.forma==='cred')return n+'receita não pode entrar no cartão de crédito.';}
    const dp=S.filter(([x])=>x.dup&&x.dup.lvl==='prov').length;
    if(dp&&!II.dupOk){II.dupOk=true;return dp+' linha(s) marcada(s) parecem duplicadas. Toque em Lançar de novo para confirmar.';}
    const out=iiGerar(S.map(a=>a[0]));D.lanc.push(...out);
    const np=out.length-S.length;toast(S.length+' transação(ões) lançada(s)'+(np>0?' em '+out.length+' parcelas':'')+'.');
    if(/^\d{4}-\d{2}$/.test(F.per||'')&&!out.some(l=>l.comp===F.per))F.per=out[0].comp;
    setTimeout(()=>goLanc({}),80);}});
  iiSum();}

Object.assign(ACT,{
  impimg:()=>{closeModal();mImpImg();},
  iirm:d=>{if(II.busy)return;const i=II.items.findIndex(x=>x.id===d.id);if(i<0)return;const it=II.items[i];if(it.url)URL.revokeObjectURL(it.url);II.items.splice(i,1);iiGrid();},
  iiretry:(d,el)=>{II.items.forEach(i=>{if(i.blob&&(i.st==='err'||i.st==='unread'))i.st='wait';});iiGrid();const f=el.closest('form');if(f)f.requestSubmit();},
  iiback:()=>{II.keep=true;mImpImg();},
  iiall:(d,el)=>{const f=el.closest('form');II.rows.forEach((x,j)=>{const c=f.elements['on_'+j];if(c){c.checked=d.v==='1';c.dispatchEvent(new Event('change',{bubbles:true}));}});}});
document.addEventListener('change',e=>{const el=e.target;if((el.id==='ii-gal'||el.id==='ii-cam')&&el.files&&el.files.length){iiAdd([...el.files]);el.value='';}});
document.addEventListener('dragover',e=>{if(e.target.closest&&e.target.closest('#ii-drop'))e.preventDefault();});
document.addEventListener('drop',e=>{if(!(e.target.closest&&e.target.closest('#ii-drop')))return;e.preventDefault();iiAdd([...(e.dataTransfer.files||[])]);});
Object.assign(window.__FP,{II:()=>II,iiRead,iiRun,iiRow,iiReview,iiGerar,iiDup,iiAdd});

})();</script>
